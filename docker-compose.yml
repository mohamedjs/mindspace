services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindspace}
      POSTGRES_DB: ${POSTGRES_DB:-mindspace}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindspace} -d ${POSTGRES_DB:-mindspace}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.8.4-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/main.migrate.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://mindspace:mindspace@postgres:5432/mindspace}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/main.http.js"]
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://mindspace:mindspace@postgres:5432/mindspace}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      JWT_SECRET: ${JWT_SECRET:-mindspace-super-secret-jwt-key-minimum-32-chars-long}
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUDIO_DIR: ${AUDIO_DIR:-/data/audio}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-mock-openrouter-key-development}
    volumes:
      - audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/main.worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://mindspace:mindspace@postgres:5432/mindspace}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      JWT_SECRET: ${JWT_SECRET:-mindspace-super-secret-jwt-key-minimum-32-chars-long}
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUDIO_DIR: ${AUDIO_DIR:-/data/audio}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-mock-openrouter-key-development}
    volumes:
      - audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-healthy"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy

  dev:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /repo
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://mindspace:mindspace@postgres:5432/mindspace}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      JWT_SECRET: ${JWT_SECRET:-mindspace-super-secret-jwt-key-minimum-32-chars-long}
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUDIO_DIR: ${AUDIO_DIR:-/data/audio}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-mock-openrouter-key-development}
    volumes:
      - .:/repo

volumes:
  pgdata:
  redisdata:
  audio:
